name: Android debug

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  debug_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest already exports ANDROID_SDK_ROOT. A second ANDROID_HOME
          # makes the Android Gradle Plugin abort, so both variables stay on this SDK.
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "${sdk}" ]; then
            echo "Android SDK not found at ${sdk}" >&2
            exit 1
          fi
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "${sdk}/platform-tools" >> "${GITHUB_PATH}"
          if [ -x "${sdk}/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdkmanager="${sdk}/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager="$(find "${sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "${sdkmanager}" ]; then
            echo "sdkmanager not found under ${sdk}" >&2
            exit 1
          fi
          yes | "${sdkmanager}" --sdk_root="${sdk}" --licenses >/dev/null || true
          "${sdkmanager}" --sdk_root="${sdk}" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk plover-lookup.apk

      - name: Publish the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Version code ${GITHUB_RUN_NUMBER}. Install plover-lookup.apk over the previous build."
          if gh release view sideload >/dev/null 2>&1; then
            gh release upload sideload plover-lookup.apk --clobber
            gh release edit sideload --notes "$notes" --latest
          else
            gh release create sideload plover-lookup.apk --title "Plover lookup" --notes "$notes" --latest
          fi

      - name: Show the APK on this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            echo "## plover-lookup.apk"
            echo "[Download plover-lookup.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/sideload/plover-lookup.apk)"
            echo ""
            echo "Version code ${GITHUB_RUN_NUMBER}. This link is the APK file."
          } >> "$GITHUB_STEP_SUMMARY"
