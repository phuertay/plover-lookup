name: Android debug

on:
  push:
  pull_request:

jobs:
  debug_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          tools_zip="${RUNNER_TEMP}/commandlinetools.zip"
          curl -fL --retry 3 -o "${tools_zip}" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir -p "${HOME}/android-sdk/cmdline-tools"
          unzip -q "${tools_zip}" -d "${RUNNER_TEMP}/cmdline-tools"
          mv "${RUNNER_TEMP}/cmdline-tools/cmdline-tools" "${HOME}/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=${HOME}/android-sdk" >> "${GITHUB_ENV}"
          echo "${HOME}/android-sdk/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/android-sdk/platform-tools" >> "${GITHUB_PATH}"
          yes | "${HOME}/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${HOME}/android-sdk/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plover-lookup-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
